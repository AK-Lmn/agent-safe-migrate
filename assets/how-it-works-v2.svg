<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Without mgcheck, SQL written by an AI assistant goes straight to production, locks the database and freezes the app. With mgcheck, the same SQL is first test-run on a shadow database, the lock is found and fixed, and a safe change is applied with zero downtime.">
  <title>Same AI-written SQL, two very different outcomes</title>
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F87171"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#60A5FA"/>
    </marker>
    <symbol id="logo" viewBox="0 0 128 128">
      <path d="M64 6 L112 24 V62 C112 92 90 112 64 122 C38 112 16 92 16 62 V24 Z" fill="url(#shield)"/>
      <path d="M38 40 V80 A26 9 0 0 0 90 80 V40 Z" fill="#E0ECFF"/>
      <path d="M38 53 A26 9 0 0 0 90 53" fill="none" stroke="#93C5FD" stroke-width="3"/>
      <path d="M38 66 A26 9 0 0 0 90 66" fill="none" stroke="#93C5FD" stroke-width="3"/>
      <ellipse cx="64" cy="40" rx="26" ry="9" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
      <circle cx="90" cy="90" r="20" fill="#22C55E" stroke="#0B1220" stroke-width="4"/>
      <path d="M80 90 L87 97 L100 83" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <!-- AI assistant card (shared by both rows) -->
    <g id="ai-card">
      <rect x="72" y="0" width="160" height="150" rx="14" fill="#111827" stroke="#1F2937" stroke-width="2"/>
      <line x1="152" y1="12" x2="152" y2="22" stroke="#64748B" stroke-width="3"/>
      <circle cx="152" cy="10" r="5" fill="#60A5FA"/>
      <rect x="124" y="22" width="56" height="42" rx="10" fill="#334155" stroke="#64748B" stroke-width="2"/>
      <circle cx="140" cy="40" r="5" fill="#60A5FA"/>
      <circle cx="164" cy="40" r="5" fill="#60A5FA"/>
      <rect x="140" y="51" width="24" height="4" rx="2" fill="#64748B"/>
      <text x="152" y="98" class="sans" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">AI assistant</text>
      <text x="152" y="120" class="sans" font-size="13" fill="#94A3B8" text-anchor="middle">writes the change</text>
    </g>
    <!-- The SQL it writes (identical in both rows) -->
    <g id="sql-card">
      <rect x="280" y="0" width="260" height="150" rx="14" fill="#111827" stroke="#1F2937" stroke-width="2"/>
      <circle cx="300" cy="20" r="5" fill="#EF4444"/>
      <circle cx="318" cy="20" r="5" fill="#F59E0B"/>
      <circle cx="336" cy="20" r="5" fill="#22C55E"/>
      <text x="352" y="25" class="mono" font-size="13" fill="#64748B">migration.sql</text>
      <text x="300" y="66" class="mono" font-size="17" fill="#E2E8F0"><tspan fill="#C084FC">CREATE INDEX</tspan> idx_email</text>
      <text x="320" y="92" class="mono" font-size="17" fill="#E2E8F0"><tspan fill="#C084FC">ON</tspan> users(email);</text>
      <text x="300" y="130" class="sans" font-size="13" font-style="italic" fill="#94A3B8">Looks perfectly fine…</text>
    </g>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: Consolas, Menlo, 'SF Mono', 'Courier New', monospace; }
  </style>

  <!-- Background -->
  <rect width="1280" height="720" rx="28" fill="#0B1220"/>

  <!-- Header -->
  <use href="#logo" x="52" y="30" width="80" height="80"/>
  <text x="148" y="78" class="sans" font-size="44" font-weight="700" fill="#FFFFFF">mgcheck</text>
  <text x="148" y="110" class="sans" font-size="21" fill="#94A3B8">Same AI-written SQL. Two very different outcomes.</text>

  <!-- ════════ Row 1: WITHOUT mgcheck ════════ -->
  <rect x="40" y="140" width="1200" height="222" rx="18" fill="#160A0D" stroke="#7F1D1D" stroke-width="2"/>
  <circle cx="81" cy="166" r="11" fill="#DC2626"/>
  <path d="M76 161 L86 171 M86 161 L76 171" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <text x="100" y="172" class="sans" font-size="16" font-weight="800" fill="#F87171" letter-spacing="1.5">WITHOUT MGCHECK</text>

  <use href="#ai-card" y="196"/>
  <use href="#sql-card" y="196"/>

  <line x1="234" y1="271" x2="276" y2="271" stroke="#F87171" stroke-width="3" marker-end="url(#arrow-red)"/>
  <line x1="542" y1="271" x2="912" y2="271" stroke="#F87171" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow-red)"/>

  <!-- Nothing in between -->
  <rect x="588" y="196" width="280" height="150" rx="14" fill="#160A0D" stroke="#7F1D1D" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="610" y="236" width="236" height="70" rx="10" fill="#160A0D"/>
  <text x="728" y="262" class="sans" font-size="20" font-weight="700" fill="#F87171" text-anchor="middle">No safety check</text>
  <text x="728" y="290" class="sans" font-size="15" fill="#FCA5A5" text-anchor="middle">runs straight on production</text>

  <!-- Production goes down -->
  <rect x="916" y="196" width="292" height="150" rx="14" fill="#3B0A0A" stroke="#DC2626" stroke-width="2"/>
  <path d="M938 236 V280 A22 7 0 0 0 982 280 V236 Z" fill="#7F1D1D" stroke="#F87171" stroke-width="2"/>
  <ellipse cx="960" cy="236" rx="22" ry="7" fill="#991B1B" stroke="#F87171" stroke-width="2"/>
  <path d="M968 270 V264 A7 7 0 0 1 982 264 V270" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <rect x="964" y="269" width="22" height="18" rx="3" fill="#DC2626" stroke="#FFFFFF" stroke-width="2"/>
  <text x="1000" y="236" class="sans" font-size="17" font-weight="800" fill="#F87171">Production locked</text>
  <text x="1000" y="262" class="sans" font-size="14" fill="#FECACA">App freezes. Users can't</text>
  <text x="1000" y="282" class="sans" font-size="14" fill="#FECACA">sign up or check out.</text>
  <text x="1000" y="316" class="sans" font-size="14" font-weight="700" fill="#FCA5A5">You get paged at 3 am.</text>

  <!-- ════════ Row 2: WITH mgcheck ════════ -->
  <rect x="40" y="374" width="1200" height="222" rx="18" fill="#08131F" stroke="#1E3A8A" stroke-width="2"/>
  <circle cx="81" cy="400" r="11" fill="#16A34A"/>
  <path d="M76 400 L80 404 L87 396" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="100" y="406" class="sans" font-size="16" font-weight="800" fill="#4ADE80" letter-spacing="1.5">WITH MGCHECK</text>

  <use href="#ai-card" y="430"/>
  <use href="#sql-card" y="430"/>

  <line x1="234" y1="505" x2="276" y2="505" stroke="#60A5FA" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="542" y1="505" x2="584" y2="505" stroke="#60A5FA" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="870" y1="505" x2="912" y2="505" stroke="#60A5FA" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <!-- mgcheck + shadow DB -->
  <rect x="588" y="430" width="280" height="150" rx="14" fill="#0F1B33" stroke="#3B82F6" stroke-width="2"/>
  <use href="#logo" x="602" y="440" width="32" height="32"/>
  <text x="642" y="463" class="sans" font-size="18" font-weight="700" fill="#FFFFFF">mgcheck</text>
  <path d="M610 486 V518 A18 6 0 0 0 646 518 V486 Z" fill="#1E293B" stroke="#60A5FA" stroke-width="2" stroke-dasharray="4 3"/>
  <ellipse cx="628" cy="486" rx="18" ry="6" fill="#334155" stroke="#60A5FA" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="660" y="498" class="sans" font-size="16" font-weight="700" fill="#93C5FD">Test-runs on a shadow DB</text>
  <text x="660" y="518" class="sans" font-size="13" fill="#94A3B8">a throwaway copy of Postgres</text>
  <circle cx="619" cy="551" r="10" fill="#16A34A"/>
  <path d="M614 551 L618 555 L625 547" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="638" y="556" class="sans" font-size="14" fill="#D1FAE5">Finds the lock → makes it safe</text>

  <!-- Production stays healthy -->
  <rect x="916" y="430" width="292" height="150" rx="14" fill="#052E16" stroke="#16A34A" stroke-width="2"/>
  <path d="M938 470 V514 A22 7 0 0 0 982 514 V470 Z" fill="#14532D" stroke="#4ADE80" stroke-width="2"/>
  <ellipse cx="960" cy="470" rx="22" ry="7" fill="#166534" stroke="#4ADE80" stroke-width="2"/>
  <circle cx="976" cy="512" r="11" fill="#16A34A" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M971 512 L975 516 L982 508" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1000" y="470" class="sans" font-size="17" font-weight="800" fill="#4ADE80">Safe change applied</text>
  <text x="1000" y="498" class="mono" font-size="13" fill="#D1FAE5"><tspan fill="#C084FC">CREATE INDEX</tspan> <tspan fill="#4ADE80" font-weight="700">CONCURRENTLY</tspan></text>
  <text x="1000" y="530" class="sans" font-size="14" fill="#D1FAE5">App stays up.</text>
  <text x="1000" y="550" class="sans" font-size="14" fill="#D1FAE5">Zero downtime.</text>

  <!-- Footer -->
  <rect x="490" y="626" width="300" height="56" rx="28" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="640" y="663" class="mono" font-size="24" fill="#FFFFFF" text-anchor="middle"><tspan fill="#4ADE80">$</tspan> npx mgcheck</text>
  <text x="56" y="660" class="sans" font-size="15" fill="#64748B">Cursor · Claude Code · Copilot · Windsurf</text>
  <text x="1224" y="660" class="sans" font-size="15" fill="#64748B" text-anchor="end">PostgreSQL · Free &amp; open source</text>
</svg>
